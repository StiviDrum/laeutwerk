[project]
name = "laeutwerk"
version = "0.3.0"
description = "Reminders from calendar events that stay open until acknowledged"
requires-python = ">=3.14.2"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["config", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D", "TID", "T20"]
ignore = [
  "D203", "D213", "RUF001", "RUF002", "RUF003", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLC0415"]
"scripts/**" = ["T20", "D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.laeutwerk"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
